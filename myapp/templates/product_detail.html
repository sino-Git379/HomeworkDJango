{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>{{ object.name }}</h2>
    <p style="margin: 15px 0; color: #666;">{{ object.description|default:"Описание отсутствует." }}</p>
    <p><strong>Цена:</strong> ${{ object.price }}</p>
    <p style="margin-bottom: 15px;"><strong>Количество:</strong> {{ object.quantity }} шт.</p>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Назад</a>
</div>
{% endblock %}
