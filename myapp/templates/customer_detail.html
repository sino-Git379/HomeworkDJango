{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>{{ object.name }}</h2>
    <p style="margin-top: 15px;"><strong>Телефон:</strong> {{ object.phone }}</p>
    <p style="margin-bottom: 15px;"><strong>Адрес:</strong> {{ object.address }}</p>
    <a href="{% url 'customer_list' %}" class="btn btn-secondary">Назад</a>
</div>
{% endblock %}
